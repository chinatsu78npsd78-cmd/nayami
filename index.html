<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お悩みワーク・ナビ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f2ea">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ワークナビ">
<style>
  :root{
    --bg:#f7f2ea; --card:#fffdf9; --ink:#4a4038; --sub:#8a7d70;
    --line:#e7ddcf; --accent:#c9a86a; --accent-d:#a98a4f;
    --chip:#f0e7d8; --soft:#faf5ec;
    --coach:#7fa693; --counsel:#8f9bc4; --therapy:#c98f9f; --teach:#c9b07f;
    --shadow:0 4px 20px rgba(120,100,70,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.7; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:640px; margin:0 auto; padding:24px 16px 60px}
  header{text-align:center; margin-bottom:22px}
  .logo{font-size:34px}
  h1{font-size:22px; margin:6px 0 4px; letter-spacing:.04em}
  .lead{color:var(--sub); font-size:13.5px; margin:0}
  .reassure{font-size:12px; color:var(--sub); margin:0 0 10px; text-align:center}
  .searchbox{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  textarea{
    width:100%; border:1px solid var(--line); border-radius:12px; resize:vertical;
    min-height:76px; padding:12px 14px; font-size:15px; color:var(--ink);
    background:var(--soft); font-family:inherit; line-height:1.6;
  }
  textarea:focus{outline:none; border-color:var(--accent)}
  .btn{
    width:100%; margin-top:12px; border:none; border-radius:12px; cursor:pointer;
    background:var(--accent); color:#fff; font-size:16px; font-weight:600;
    padding:13px; letter-spacing:.06em; transition:background .15s;
  }
  .btn:hover{background:var(--accent-d)}
  .hint{color:var(--sub); font-size:12px; margin:12px 2px 6px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    background:var(--chip); border:1px solid var(--line); border-radius:999px;
    padding:6px 13px; font-size:12.5px; color:var(--ink); cursor:pointer;
    transition:background .15s;
  }
  .chip:hover{background:#e7dcc7}
  .results{margin-top:22px}
  .resulthead{font-size:13px; color:var(--sub); margin:0 2px 12px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px 18px 16px; box-shadow:var(--shadow); margin-bottom:16px;
    position:relative; overflow:hidden;
  }
  .card.top{border-color:var(--accent)}
  .rank{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em;
    color:var(--accent-d); background:var(--soft); border:1px solid var(--line);
    border-radius:999px; padding:2px 10px; margin-bottom:8px;
  }
  .wname{font-size:19px; font-weight:700; margin:2px 0 8px}
  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
  .badge{font-size:11px; color:#fff; border-radius:999px; padding:2px 10px}
  .b-coach{background:var(--coach)} .b-counsel{background:var(--counsel)}
  .b-therapy{background:var(--therapy)} .b-teach{background:var(--teach)}
  .b-day{background:#b9a884} .b-time{background:#cbb98f}
  .why{
    background:var(--soft); border-radius:12px; padding:11px 13px; margin-bottom:12px;
    font-size:13px; color:var(--sub);
  }
  .why b{color:var(--ink); font-weight:600}
  .why ul{margin:7px 0 0; padding-left:18px}
  .why li{margin:3px 0}
  .field{margin:10px 0}
  .flabel{font-size:12px; color:var(--accent-d); font-weight:700; margin-bottom:2px}
  .ftext{font-size:14px; white-space:pre-wrap}
  details{margin:9px 0; border-top:1px dashed var(--line); padding-top:9px}
  summary{cursor:pointer; font-size:13.5px; color:var(--accent-d); font-weight:600; list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ "; color:var(--accent)}
  details[open] summary::before{content:"▾ "}
  .steps{font-size:13.5px; white-space:pre-wrap; margin-top:8px; color:var(--ink)}
  .pdf{
    display:inline-block; margin-top:12px; text-decoration:none; font-size:13px;
    color:var(--accent-d); border:1px solid var(--accent); border-radius:10px;
    padding:7px 14px; font-weight:600;
  }
  .pdf:hover{background:var(--soft)}
  .empty{text-align:center; color:var(--sub); font-size:14px; padding:20px}
  .allworks{margin-top:34px}
  .allworks h2{font-size:15px; margin:0 0 10px; color:var(--ink)}
  .allcases{margin-top:34px}
  .allcases h2{font-size:15px; margin:0 0 6px; color:var(--ink)}
  .cfilter{width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    font-size:14px; background:var(--soft); font-family:inherit; margin:8px 0 10px}
  .cfilter:focus{outline:none; border-color:var(--accent)}
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .caselist{max-height:420px; overflow-y:auto; border:1px solid var(--line);
    border-radius:14px; background:var(--card); margin-top:10px; box-shadow:var(--shadow)}
  .caserow{display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line);
    padding:12px 14px; cursor:pointer; font-family:inherit; font-size:13.5px; color:var(--ink); line-height:1.6}
  .caserow:last-child{border-bottom:none}
  .caserow:hover{background:var(--soft)}
  .cnayami{width:100%; word-break:break-word}
  .cwork{align-self:flex-start; max-width:100%; font-size:10.5px; color:var(--accent-d); background:var(--soft);
    border:1px solid var(--line); border-radius:999px; padding:2px 10px; white-space:normal; line-height:1.4}
  footer{text-align:center; color:var(--sub); font-size:11px; margin-top:36px; line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🕊️</div>
    <h1>お悩みワーク・ナビ</h1>
    <p class="lead">いまの気持ちや状況を<br>そのまま書いてみてね。<br><br>正しい言葉じゃなくて大丈夫。<br>合いそうなワークを、そっとご提案します</p>
  </header>

  <div class="searchbox">
    <p class="reassure">書いたことは、この画面の中だけ。<br>どこにも送られないよ。</p>
    <textarea id="q" placeholder="例）人前で話すとき緊張して頭が真っ白になる"></textarea>
    <button class="btn" id="go">ワークを探す</button>
    <div class="hint">こんな言葉でもOK：</div>
    <div class="chips" id="examples"></div>
  </div>

  <div class="results" id="results"></div>

  <div class="allworks">
    <h2>すべてのワークから見る</h2>
    <div class="chips" id="allchips"></div>
  </div>

  <div class="allcases">
    <h2>お悩み一覧から選ぶ（<span id="caseCount"></span>件）</h2>
    <div class="hint">気になるお悩みをタップすると、合いそうなワークをおすすめ順に出すよ。</div>
    <input id="caseFilter" class="cfilter" placeholder="キーワードでしぼる（例：仕事、緊張、親）">
    <div class="chips" id="typeChips"></div>
    <div class="caselist" id="caselist"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>

    "サブモダリティ／好きから好きではない":["お菓子","甘いもの","間食","ジャンク","食べすぎ","好きだけど","やめたい味","甘い物"],
    "悪習慣の改善":["習慣","やめられない","つい","だらだら","スマホ","ゲーム","夜更かし","先延ばし","二度寝","酒","たばこ","タバコ","飲みすぎ"],
    "肯定的意図":["やめられない","依存","癖","わかってるのに"],
    "パーツインテグレーション":["葛藤","やりたいのに","わかっているのに","相反","二つの気持ち","踏み出せない","迷い","もう一人の自分"],
    "アウトカムフレーム":["目標","ゴール","やりたいこと","夢","叶えたい","方向性","何がしたい"],
    "チェインプロセス":["達成","実現","叶える","前に進み","ステップ"],
    "モデリング":["なりたい","憧れ","真似","見習","できる人","ロールモデル","成功者","あの人みたい"],
    "サークル・オブ・エクセレンス":["緊張","本番","プレゼン","面接","ここぞ","実力","あがり症","発表","試験","舞台"],
    "アンカリング":["落ち着き","集中","やる気","スイッチ","気持ちの切り替え","状態を作"],
    "ニューロ・ロジカル・レベル":["自分軸","ぶれ","在り方","アイデンティティ","使命","自己一致","生き方"],
    "ストラテジー":["効率","段取り","手順","やり方","うまくいかない","要領"],
    "Generative NLP Format":["未来","これから","人生","過去を","意味づけ","生き直"]
  };

  // ---- テキスト正規化・バイグラム ----
  function norm(s){
    return (s||"").normalize("NFKC").toLowerCase()
      .replace(/[\s、。,.!！?？・「」『』（）()～ー\-＿_･:：;；]/g,"");
  }
  function grams(s){
    s = norm(s);
    const set = new Set();
    if(!s) return set;
    for(let i=0;i<s.length;i++){ set.add(s[i]); }
    for(let i=0;i<s.length-1;i++){ set.add(s.slice(i,i+2)); }
    return set;
  }
  function dice(a,b){
    if(!a.size||!b.size) return 0;
    let inter=0; a.forEach(x=>{ if(b.has(x)) inter++; });
    return (2*inter)/(a.size+b.size);
  }

  // 各ケース・各ワークのグラムを前計算
  cases.forEach(c=>{ c._g = grams(c.nayami+" "+c.purpose+" "+c.type); });
  works.forEach(w=>{ w._g = grams(w.solve+" "+w.scene+" "+w.name); });
  works.forEach(w=>{ w._cases = cases.filter(c=>c.work===w.name); });

  const catClass = {"コーチング":"b-coach","カウンセリング":"b-counsel","セラピー":"b-therapy","ティーチング":"b-teach"};
  function badgesHTML(w){
    let h="";
    (w.cat||"").split(/[,、\s]+/).filter(Boolean).forEach(c=>{
      h+='<span class="badge '+(catClass[c]||"b-teach")+'">'+esc(c)+'</span>';
    });
    if(w.day) h+='<span class="badge b-day">'+esc(w.day)+'</span>';
    if(w.time) h+='<span class="badge b-time">⏱ '+esc(w.time)+'</span>';
    return h;
  }
  function esc(s){return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

  function search(q){
    const qg = grams(q);
    if(qg.size===0) return [];
    // ケースごとにスコア
    const scored = cases.map(c=>({c, s:dice(qg,c._g)}));
    scored.sort((a,b)=>b.s-a.s);
    // ワークごとに集約（そのワークの最良ケース＝主スコア＋近いケースを根拠に）
    const agg = {};
    scored.forEach(({c,s})=>{
      if(!agg[c.work]) agg[c.work]={work:c.work, best:0, ex:[]};
      const a=agg[c.work];
      if(s>a.best) a.best=s;
      if(a.ex.length<3 && s>0.08) a.ex.push({t:c.nayami, s});
    });
    // ケース0件のワークも、ワーク自身の説明文で拾う
    works.forEach(w=>{
      const s = dice(qg,w._g)*0.9;
      if(!agg[w.name]) agg[w.name]={work:w.name,best:0,ex:[]};
      if(s>agg[w.name].best) agg[w.name].best=Math.max(agg[w.name].best,s);
    });
    // 手がかりキーワードで加点（言葉のゆらぎ・意味のズレを補正）
    const nq = norm(q);
    works.forEach(w=>{
      const kws = KW[w.name]||[];
      let hits=0; kws.forEach(k=>{ if(nq.indexOf(norm(k))>=0) hits++; });
      if(hits>0){
        if(!agg[w.name]) agg[w.name]={work:w.name,best:0,ex:[]};
        agg[w.name].best += Math.min(hits,2)*0.22;
      }
    });
    const arr = Object.values(agg).filter(a=>wmap[a.work]);
    arr.sort((a,b)=>b.best-a.best);
    return arr;
  }

  function render(q, pinWork){
    const res = document.getElementById("results");
    q=(q||"").trim();
    if(!q){
      res.innerHTML='<div class="empty">まずは、いまの気持ちや状況を上の欄に書いてみてね。<br>思いつかないときは、下の言葉をタップしてもOKだよ。</div>';
      res.scrollIntoView({behavior:"smooth",block:"center"});
      document.getElementById("q").focus();
      return;
    }
    const qg = grams(q);
    let ranked = search(q).filter(r=>r.best>0.05).slice(0,4);
    if(pinWork && wmap[pinWork]){
      ranked = ranked.filter(r=>r.work!==pinWork);
      const exs = (wmap[pinWork]._cases||[]).map(c=>({t:c.nayami, s:dice(qg,c._g)}))
                    .sort((a,b)=>b.s-a.s).slice(0,3);
      ranked.unshift({work:pinWork, best:1, ex:exs});
    }
    ranked = ranked.slice(0,3);
    if(ranked.length===0){
      res.innerHTML='<div class="empty">今回は、ぴったり重なるものが見つからなかったみたい。あなたの書き方のせいじゃないよ。<br>気持ち・場面・体の感じなど、別の言葉でもう一度そっと書いてみてね。</div>';
      res.scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
    const strong = !!pinWork || ranked[0].best>=0.18;
    let html='<p class="resulthead">'+(pinWork?("「"+esc(q)+"」に、こんなワークが合いそうだよ"):(strong?"この状況に、こんなワークが合いそうだよ":"近いものをさがしてみたよ。しっくりくるものを選んでみてね"))+'</p>';
    ranked.forEach((r,i)=>{
      const w=wmap[r.work];
      html+='<div class="card'+(i===0?" top":"")+'">';
      html+='<span class="rank">'+(i===0?"いちばん近い":(i===1?"つぎに近い":"こんな選択肢も"))+'</span>';
      html+='<div class="wname">'+esc(w.name)+'</div>';
      html+='<div class="badges">'+badgesHTML(w)+'</div>';
      if(r.ex && r.ex.length){
        html+='<div class="why"><b>こんなお悩みで使われています</b><ul>';
        r.ex.forEach(e=>{ html+='<li>'+esc(e.t)+'</li>'; });
        html+='</ul></div>';
      }
      if(w.solve) html+=field("このワークで向かうところ", w.solve);
      if(w.scene) html+=field("どんな場面で", w.scene);
      if(w.script) html+='<details><summary>進め方（かんたんな流れ）</summary><div class="steps">'+esc(w.script)+'</div></details>';
      if(w.caution) html+='<details><summary>進めるときに、心にとめておいてね</summary><div class="steps">'+esc(w.caution)+'</div></details>';
      if(w.pdf && /^https?:/.test(w.pdf)){
        const first=w.pdf.split(/https/).filter(Boolean)[0];
        html+='<a class="pdf" target="_blank" rel="noopener" href="https'+esc(first)+'">📄 くわしい進め方（PDF）を開く</a>';
      }
      html+='</div>';
    });
    res.innerHTML=html;
    res.scrollIntoView({behavior:"smooth",block:"start"});
  }
  function field(label,val){
    return '<div class="field"><div class="flabel">'+esc(label)+'</div><div class="ftext">'+esc(val)+'</div></div>';
  }

  // 入力例チップ
  const examples=["人前で緊張して頭が真っ白になる","やめたいのにやめられない習慣がある","苦手な人との関係を変えたい","目標がぼんやりしていて動けない","過去の嫌な言葉が頭から離れない","本番で実力が出せない","高いところ・虫などが怖い","自分に自信が持てない"];
  const exBox=document.getElementById("examples");
  examples.forEach(t=>{
    const c=document.createElement("span"); c.className="chip"; c.textContent=t;
    c.onclick=()=>{ document.getElementById("q").value=t; render(t); };
    exBox.appendChild(c);
  });

  // 全ワークchip
  const allBox=document.getElementById("allchips");
  works.forEach(w=>{
    const c=document.createElement("span"); c.className="chip"; c.textContent=w.name;
    c.onclick=()=>{ document.getElementById("q").value=w.solve||w.name; render(w.solve||w.name); };
    allBox.appendChild(c);
  });

  document.getElementById("go").onclick=()=>render(document.getElementById("q").value);
  document.getElementById("q").addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter") render(document.getElementById("q").value);
  });

  // お悩み一覧（種別フィルター＋キーワード絞り込み）
  const typeSet=[...new Set(cases.map(c=>c.type||"その他"))];
  let curType="__all";
  const caselist=document.getElementById("caselist");
  const cfilter=document.getElementById("caseFilter");
  const typeChips=document.getElementById("typeChips");
  function tchip(label,active,fn){ const s=document.createElement("span"); s.className="chip"+(active?" on":""); s.textContent=label; s.onclick=fn; return s; }
  function renderTypeChips(){
    typeChips.innerHTML="";
    typeChips.appendChild(tchip("すべて",curType==="__all",()=>{curType="__all";renderTypeChips();renderCaseList();}));
    typeSet.forEach(t=>typeChips.appendChild(tchip(t,curType===t,()=>{curType=t;renderTypeChips();renderCaseList();})));
  }
  function renderCaseList(){
    const kw=norm(cfilter.value);
    const filtered=cases.filter(c=>{
      if(curType!=="__all" && (c.type||"その他")!==curType) return false;
      if(kw && norm(c.nayami+c.purpose+c.type).indexOf(kw)<0) return false;
      return true;
    });
    document.getElementById("caseCount").textContent=filtered.length;
    let h="";
    filtered.forEach(c=>{
      const gi=cases.indexOf(c);
      h+='<button class="caserow" data-i="'+gi+'"><span class="cnayami">'+esc(c.nayami)+'</span><span class="cwork">'+esc(c.work)+'</span></button>';
    });
    caselist.innerHTML=h || '<div class="empty">その条件のお悩みは見つからなかったみたい。別の言葉でしぼってみてね。</div>';
    [...caselist.querySelectorAll(".caserow")].forEach(b=>{
      b.onclick=()=>{ const c=cases[+b.dataset.i]; document.getElementById("q").value=c.nayami; render(c.nayami, c.work); };
    });
  }
  cfilter.addEventListener("input",renderCaseList);
  renderTypeChips(); renderCaseList();

  document.getElementById("foot").innerHTML =
    "NLPコーチングワーク "+works.length+"種<br>"+
    "悩みケース "+cases.length+"件<br>"+
    "このナビは、あなたに合いそうな<br>"+
    "ワークを一緒にさがす“目安”です";

  // ホーム画面アプリ用（対応ページでのみ有効。失敗しても何もしない）
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  }
})();
</script>
